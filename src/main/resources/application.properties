spring.application.name=LiveShield

server.port=${PORT:8082}

# ============================================================
# DATABASE
# ============================================================

spring.datasource.url=jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:liveshield}
spring.datasource.username=${DATABASE_USERNAME:liveshield}
spring.datasource.password=${DATABASE_PASSWORD:liveshield}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

# ============================================================
# THYMELEAF
# ============================================================

spring.thymeleaf.cache=false

# ============================================================
# ACTUATOR
# ============================================================

management.endpoints.web.exposure.include=health,info

# ============================================================
# EMAIL NOTIFICATIONS - SMTP & GMAIL
# ============================================================

liveshield.admin.emails=${ADMIN_EMAILS:}

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:${SPRING_MAIL_USERNAME:}}
spring.mail.password=${MAIL_PASSWORD:${SPRING_MAIL_PASSWORD:}}
spring.mail.from=${SPRING_MAIL_FROM:${MAIL_USERNAME:}}

google.gmail.client-id=${GOOGLE_GMAIL_CLIENT_ID:}
google.gmail.client-secret=${GOOGLE_GMAIL_CLIENT_SECRET:}
google.gmail.refresh-token=${GOOGLE_GMAIL_REFRESH_TOKEN:}
google.gmail.sender-email=${GOOGLE_GMAIL_SENDER_EMAIL:}

# ============================================================
# WHATSAPP NOTIFICATIONS - TWILIO
# ============================================================

twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.whatsapp-from=${TWILIO_WHATSAPP_FROM:}

liveshield.admin.whatsapp-numbers=${LIVESHIELD_ADMIN_WHATSAPP_NUMBERS:}
